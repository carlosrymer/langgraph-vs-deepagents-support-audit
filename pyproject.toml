[project]
name = "support-audit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph==1.2.12",
  "deepagents==0.7.19",
  "langchain==1.4.2",
  "langchain-openai==1.6.6",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_audit"]
